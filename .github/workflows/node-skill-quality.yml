name: SIP-01 node and skill quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Confirm Python runtime and compile node sources
        working-directory: scrapling-node
        run: |
          python -c "import sys, tomllib; assert sys.version_info >= (3, 11)"
          python -m py_compile sip01_node/*.py
      - name: Install locked crawler and test dependencies
        working-directory: scrapling-node
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run crawler, parser, protocol and SSRF regression tests
        working-directory: scrapling-node
        run: python -m pytest -q
      - name: Check bundled verification script syntax
        run: bash -n .agents/skills/sip01-node/scripts/verify_install.sh
      - name: Install upstream Agent Skills validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - name: Validate bundled SIP-01 node skill
        run: skills-ref validate .agents/skills/sip01-node
